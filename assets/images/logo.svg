<svg width="200" height="200" viewBox="0 0 200 200" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="logoGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FF6B35;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#F7931E;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#FFD23F;stop-opacity:1" />
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="2" dy="4" stdDeviation="3" flood-color="rgba(0,0,0,0.3)"/>
    </filter>
  </defs>
  
  <!-- Background Circle -->
  <circle cx="100" cy="100" r="95" fill="url(#logoGradient)" filter="url(#shadow)"/>
  
  <!-- Gear Outline -->
  <g transform="translate(100,100)">
    <!-- Gear teeth -->
    <g fill="white" opacity="0.9">
      <rect x="-3" y="-85" width="6" height="15" rx="2"/>
      <rect x="-3" y="70" width="6" height="15" rx="2"/>
      <rect x="-85" y="-3" width="15" height="6" rx="2"/>
      <rect x="70" y="-3" width="15" height="6" rx="2"/>
      
      <!-- Diagonal teeth -->
      <rect x="-60" y="-60" width="6" height="15" rx="2" transform="rotate(45)"/>
      <rect x="-60" y="45" width="6" height="15" rx="2" transform="rotate(45)"/>
      <rect x="45" y="-60" width="6" height="15" rx="2" transform="rotate(45)"/>
      <rect x="45" y="45" width="6" height="15" rx="2" transform="rotate(45)"/>
    </g>
    
    <!-- Inner gear circle -->
    <circle cx="0" cy="0" r="65" fill="white" opacity="0.95"/>
    
    <!-- Center rose/flower pattern -->
    <g fill="#FF6B35">
      <!-- Rose petals -->
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(0)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(45)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(90)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(135)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(180)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(225)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(270)"/>
      <ellipse cx="0" cy="-25" rx="8" ry="20" transform="rotate(315)"/>
    </g>
    
    <!-- Center circle -->
    <circle cx="0" cy="0" r="12" fill="#FF6B35"/>
    
    <!-- Wheat/laurel branches -->
    <g fill="#4CAF50" opacity="0.8">
      <!-- Left branch -->
      <path d="M -45 20 Q -50 25 -45 30 Q -40 35 -45 40 Q -50 45 -45 50" stroke="#4CAF50" stroke-width="2" fill="none"/>
      <ellipse cx="-42" cy="22" rx="3" ry="6" transform="rotate(-20)"/>
      <ellipse cx="-44" cy="32" rx="3" ry="6" transform="rotate(-10)"/>
      <ellipse cx="-42" cy="42" rx="3" ry="6" transform="rotate(-20)"/>
      
      <!-- Right branch -->
      <path d="M 45 20 Q 50 25 45 30 Q 40 35 45 40 Q 50 45 45 50" stroke="#4CAF50" stroke-width="2" fill="none"/>
      <ellipse cx="42" cy="22" rx="3" ry="6" transform="rotate(20)"/>
      <ellipse cx="44" cy="32" rx="3" ry="6" transform="rotate(10)"/>
      <ellipse cx="42" cy="42" rx="3" ry="6" transform="rotate(20)"/>
    </g>
  </g>
  
  <!-- KSCSTE text at bottom -->
  <text x="100" y="180" text-anchor="middle" font-family="Arial, sans-serif" font-size="12" font-weight="bold" fill="white">
    KSCSTE
  </text>
</svg>